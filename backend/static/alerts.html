<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>告警中心 - Temu Workflow</title>
<link rel="stylesheet" href="common.css">
<style>
  .main-content { display: flex; height: calc(100vh - 56px); }
  .alert-side { width: 240px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 12px 0; }
  .alert-list { flex: 1; overflow-y: auto; padding: 24px 32px; background: #fafbfc; }

  .alert-side-title {
    padding: 12px 16px 8px;
    font-size: 11px; font-weight: 600;
    color: #86909c; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .alert-side-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    color: #4e5969; cursor: pointer;
    font-size: 13px;
    transition: all 0.1s;
    border-left: 3px solid transparent;
  }
  .alert-side-item:hover { background: #fafbfc; color: #1f2329; }
  .alert-side-item.active { background: #f0f5ff; color: #3370ff; border-left-color: #3370ff; }

  .alert-side-icon { font-size: 14px; width: 16px; text-align: center; }
  .alert-side-count {
    margin-left: auto; padding: 1px 6px;
    background: #f0f1f3; color: #4e5969;
    border-radius: 8px; font-size: 10px;
    min-width: 18px; text-align: center;
  }
  .alert-side-item.active .alert-side-count { background: #3370ff; color: #fff; }
  .alert-side-item.error .alert-side-count { background: #f56565; color: #fff; }
  .alert-side-item.warning .alert-side-count { background: #ff7d00; color: #fff; }

  /* 时间线 */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content: ''; position: absolute;
    left: 6px; top: 8px; bottom: 8px;
    width: 2px; background: #e5e7eb;
  }
  .timeline-item {
    position: relative; padding-bottom: 20px;
  }
  .timeline-dot {
    position: absolute; left: -22px; top: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid #c9cdd4;
  }
  .timeline-dot.error { background: #f56565; border-color: #f56565; }
  .timeline-dot.warning { background: #ff7d00; border-color: #ff7d00; }
  .timeline-dot.info { background: #3370ff; border-color: #3370ff; }

  .timeline-content {
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 4px; padding: 12px 16px;
  }
  .timeline-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .timeline-title { font-size: 13px; font-weight: 600; flex: 1; }
  .timeline-time { font-size: 11px; color: #86909c; }
  .timeline-message {
    font-size: 12px; color: #4e5969; line-height: 1.6;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">T</div>
      <div>
        <div class="sidebar-brand-title">Temu Workflow</div>
        <div class="sidebar-brand-sub">自动选品与上品</div>
      </div>
    </div>

    <div class="sidebar-section">主要功能</div>
    <a href="dashboard.html" class="sidebar-item">
      <span class="sidebar-item-icon">📊</span>业务看板
    </a>
    <a href="review.html" class="sidebar-item">
      <span class="sidebar-item-icon">✓</span>一审工作台
      <span class="sidebar-item-badge" id="badge-first-review">0</span>
    </a>
    <a href="listings.html" class="sidebar-item">
      <span class="sidebar-item-icon">📝</span>资料编辑
    </a>
    <a href="second-review.html" class="sidebar-item">
      <span class="sidebar-item-icon">🔍</span>二审工作台
    </a>
    <a href="publish.html" class="sidebar-item">
      <span class="sidebar-item-icon">🚀</span>发布监控
      <span class="sidebar-item-badge" id="badge-to-publish">0</span>
    </a>

    <div class="sidebar-section">运维</div>
    <a href="alerts.html" class="sidebar-item active">
      <span class="sidebar-item-icon">🔔</span>告警中心
      <span class="sidebar-item-badge" id="badge-alerts" style="background:#ff7d00">0</span>
    </a>
    <a href="config.html" class="sidebar-item">
      <span class="sidebar-item-icon">⚙️</span>系统配置
    </a>
    <a href="data-sources.html" class="sidebar-item">
      <span class="sidebar-item-icon">🔌</span>数据源管理
    </a>

    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="user-avatar">A</div>
      <div>
        <div class="sidebar-user-name" id="user-name">--</div>
        <div class="sidebar-user-role" id="user-role">--</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-breadcrumb">
        <span>运维</span>
        <span style="margin:0 8px">/</span>
        <span class="topbar-breadcrumb-current">告警中心</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-search">
        <span>🔍</span>
        <input type="text" placeholder="搜索告警" />
      </div>
      <div class="topbar-icon" onclick="location.href='alerts.html'">🔔<span class="topbar-badge" id="topbar-alert-badge">0</span></div>
      <div class="topbar-user" onclick="logout()">
        <div class="topbar-user-avatar" id="topbar-avatar">A</div>
      </div>
    </header>

    <div class="main-content">
      <!-- 左侧分组导航 -->
      <div class="alert-side">
        <div class="alert-side-title">分组</div>
        <div class="alert-side-item active" onclick="filterByLevel('all')">
          <span class="alert-side-icon">📋</span>全部
          <span class="alert-side-count" id="count-all">0</span>
        </div>
        <div class="alert-side-item error" onclick="filterByLevel('error')">
          <span class="alert-side-icon">🔴</span>错误
          <span class="alert-side-count" id="count-error">0</span>
        </div>
        <div class="alert-side-item warning" onclick="filterByLevel('warning')">
          <span class="alert-side-icon">🟡</span>警告
          <span class="alert-side-count" id="count-warning">0</span>
        </div>
        <div class="alert-side-item" onclick="filterByLevel('info')">
          <span class="alert-side-icon">🔵</span>信息
          <span class="alert-side-count" id="count-info">0</span>
        </div>

        <div class="alert-side-title" style="margin-top: 16px;">快捷操作</div>
        <div class="alert-side-item" onclick="sendTest()">
          <span class="alert-side-icon">📨</span>发送测试告警
        </div>
      </div>

      <!-- 右侧告警列表（时间线） -->
      <div class="alert-list">
        <div class="page-header" style="margin-bottom: 20px;">
          <div>
            <div class="page-title">告警时间线</div>
            <div class="page-subtitle">最近 50 条告警 · 每 10 秒自动刷新</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-default" onclick="loadAlerts()">🔄 刷新</button>
            <button class="btn btn-default" onclick="markAllRead()">全部标记已读</button>
          </div>
        </div>
        <div id="alerts-timeline" class="timeline">
          <div style="text-align: center; color: #86909c; padding: 32px;">加载中...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
let token = null;
let user = null;
let alerts = [];
let currentFilter = 'all';

function logout() { localStorage.clear(); window.location.href = '/ui/login.html'; }

function fillUser() {
  const raw = localStorage.getItem('temu_user');
  if (!raw) { window.location.href = '/ui/login.html'; return; }
  user = JSON.parse(raw);
  document.getElementById('user-name').textContent = user.display_name;
  document.getElementById('user-role').textContent = user.role;
  document.getElementById('user-avatar').textContent = user.display_name[0] || 'U';
  document.getElementById('topbar-avatar').textContent = user.display_name[0] || 'U';
}

async function api(path, opts = {}) {
  if (!token) { window.location.href = '/ui/login.html'; return; }
  const r = await fetch(API + path, {
    ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) },
  });
  if (r.status === 401) { logout(); return; }
  return r.json();
}

async function loadAlerts() {
  alerts = await api('/api/v1/alerts') || [];
  const counts = { error: 0, warning: 0, info: 0 };
  alerts.forEach(a => { counts[a.level] = (counts[a.level] || 0) + 1; });
  document.getElementById('count-all').textContent = alerts.length;
  document.getElementById('count-error').textContent = counts.error;
  document.getElementById('count-warning').textContent = counts.warning;
  document.getElementById('count-info').textContent = counts.info;
  document.getElementById('badge-alerts').textContent = counts.error;
  document.getElementById('topbar-alert-badge').textContent = counts.error;
  document.getElementById('topbar-alert-badge').style.display = counts.error > 0 ? 'block' : 'none';
  render();
}

function filterByLevel(level) {
  currentFilter = level;
  document.querySelectorAll('.alert-side-item').forEach(el => el.classList.remove('active'));
  event.target.closest('.alert-side-item').classList.add('active');
  render();
}

function render() {
  const filtered = currentFilter === 'all' ? alerts : alerts.filter(a => a.level === currentFilter);

  const timeline = document.getElementById('alerts-timeline');
  if (filtered.length === 0) {
    timeline.innerHTML = '<div style="text-align: center; color: #86909c; padding: 32px;">✓ 当前分组无告警</div>';
    return;
  }

  timeline.innerHTML = filtered.slice(0, 50).map(a => {
    const msg = a.message || '';
    return `
      <div class="timeline-item">
        <div class="timeline-dot ${a.level}"></div>
        <div class="timeline-content">
          <div class="timeline-header">
            <span class="tag ${a.level === 'error' ? 'tag-danger' : a.level === 'warning' ? 'tag-warning' : 'tag-primary'}">${a.level.toUpperCase()}</span>
            <span class="timeline-title">${a.title}</span>
            <span class="timeline-time">${new Date(a.created_at).toLocaleString('zh-CN')}</span>
          </div>
          ${msg ? `<div class="timeline-message">${msg}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function sendTest() {
  await api('/api/v1/alerts/send', {
    method: 'POST',
    body: JSON.stringify({
      level: 'info',
      title: '测试告警',
      message: `来自业务监控的测试 (${new Date().toLocaleString('zh-CN')})`,
    }),
  });
  setTimeout(loadAlerts, 500);
}

function markAllRead() {
  alert('已读标记功能预留（实际需后端事件表新增 read_at 字段）');
}

fillUser();
token = localStorage.getItem('temu_token');
loadAlerts();
setInterval(loadAlerts, 10000);
</script>
</body>
</html>
